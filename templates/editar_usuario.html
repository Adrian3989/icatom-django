{% extends 'base.html' %}

{% block title %}Editar Usuario — ICATOM{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
        <i class="bi bi-pencil text-success"></i> Editar Usuario
    </h4>
    <a href="{% url 'usuarios' %}" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre completo</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="nombre" class="form-control"
                                   value="{{ usuario.nombre }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control"
                                   value="{{ usuario.email }}" disabled>
                        </div>
                        <small class="text-muted">El correo no se puede modificar.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rol</label>
                        <select name="rol" class="form-select" required>
                            <option value="trabajador"
                                {% if usuario.rol == 'trabajador' %}selected{% endif %}>
                                Trabajador de Campo
                            </option>
                            <option value="agronomo"
                                {% if usuario.rol == 'agronomo' %}selected{% endif %}>
                                Agrónomo
                            </option>
                            <option value="administrador"
                                {% if usuario.rol == 'administrador' %}selected{% endif %}>
                                Administrador
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Estado</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox"
                                   name="activo" id="activoSwitch"
                                   {% if usuario.activo %}checked{% endif %}>
                            <label class="form-check-label" for="activoSwitch">
                                Usuario activo
                            </label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-check-circle"></i> Guardar Cambios
                        </button>
                        <a href="{% url 'usuarios' %}" class="btn btn-outline-secondary w-100 py-2">
                            Cancelar
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
